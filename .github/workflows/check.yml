name: BMS check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bms-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests twilio playwright python-dotenv
      - run: playwright install --with-deps chromium
      - run: python alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TW_SID: ${{ secrets.TW_SID }}
          TW_TOKEN: ${{ secrets.TW_TOKEN }}
          TW_NUMBER: ${{ secrets.TW_NUMBER }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
      - name: Save state
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add alerted.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
